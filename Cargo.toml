[package]
name = "kktypr"
version = "0.1.0"
edition = "2024"
authors = ["Kushagra Kumar <kk376>"]
description = "A blazingly fast touch-typing academy and developer syntax tutor for your terminal"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kk376/kktypr"
homepage = "https://github.com/kk376/kktypr"
keywords = ["typing", "touch-typing", "tui", "terminal", "ratatui"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = "0.29.0"
directories = "6.0.0"
rand = "0.10.3"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
