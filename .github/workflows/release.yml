name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    name: Build and Publish Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools zstd gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64 zip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-pc-windows-gnu

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: |
          cargo build --release --bin kktypr --target x86_64-unknown-linux-gnu
          cargo build --release --bin kktypr --target x86_64-unknown-linux-musl
          CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc \
            cargo build --release --bin kktypr --target aarch64-unknown-linux-musl
          cargo build --release --bin kktypr --target x86_64-pc-windows-gnu

      - name: Package release artifacts
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "refs/heads/main" ]; then
            VERSION="0.1.1"
          else
            VERSION="${TAG_NAME#v}"
          fi
          mkdir -p dist

          # 1. Standalone Universal Static Binaries (for cargo-binstall & direct curl)
          cp target/x86_64-unknown-linux-musl/release/kktypr dist/kktypr-linux-musl-x86_64
          chmod 755 dist/kktypr-linux-musl-x86_64

          cp target/aarch64-unknown-linux-musl/release/kktypr dist/kktypr-linux-musl-aarch64
          chmod 755 dist/kktypr-linux-musl-aarch64

          # 2. Linux x86_64 Tarball (.tar.gz)
          TAR_DIR="kktypr-${VERSION}-x86_64-unknown-linux-gnu"
          mkdir -p "${TAR_DIR}"
          cp target/x86_64-unknown-linux-gnu/release/kktypr "${TAR_DIR}/kktypr"
          cp README.md LICENSE "${TAR_DIR}/"
          tar -czf "dist/kktypr-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" "${TAR_DIR}"
          rm -rf "${TAR_DIR}"

          # 3. Windows x86_64 Release Zip
          mkdir -p pkg-windows
          cp target/x86_64-pc-windows-gnu/release/kktypr.exe pkg-windows/
          cp README.md LICENSE pkg-windows/
          (cd pkg-windows && zip -r "../dist/kktypr-windows-x86_64.zip" kktypr.exe README.md LICENSE)
          rm -rf pkg-windows

          # 4. Arch Linux Package (.pkg.tar.zst)
          PKGDIR="pkg-arch-build"
          mkdir -p "${PKGDIR}/usr/bin"
          mkdir -p "${PKGDIR}/usr/share/doc/kktypr"
          mkdir -p "${PKGDIR}/usr/share/licenses/kktypr"

          cp target/x86_64-unknown-linux-gnu/release/kktypr "${PKGDIR}/usr/bin/kktypr"
          cp README.md "${PKGDIR}/usr/share/doc/kktypr/README.md"
          cp LICENSE "${PKGDIR}/usr/share/licenses/kktypr/LICENSE"
          chmod 755 "${PKGDIR}/usr/bin/kktypr"

          SIZE=$(du -sb "${PKGDIR}" | awk '{print $1}')
          BUILDDATE=$(date +%s)

          cat <<EOF > "${PKGDIR}/.PKGINFO"
          pkgname = kktypr
          pkgbase = kktypr
          pkgver = ${VERSION}-1
          pkgdesc = A blazingly fast touch typing academy and developer syntax tutor for your terminal
          url = https://github.com/kk376/kktypr
          builddate = ${BUILDDATE}
          packager = Kushagra Kumar (kk376) <packaging@kkfetch.rs>
          size = ${SIZE}
          arch = x86_64
          license = MIT
          depend = glibc
          EOF

          (cd "${PKGDIR}" && tar --zstd -cf "../dist/kktypr-${VERSION}-1-x86_64.pkg.tar.zst" .PKGINFO usr)
          rm -rf "${PKGDIR}"

          # 5. Generate SHA256 checksums
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
