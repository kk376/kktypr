name: Bug Report
description: File a bug report to help diagnose and resolve an issue in kktypr
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill in the details below to help us reproduce and fix the issue.
  - type: input
    id: version
    attributes:
      label: kktypr Version / Commit
      description: The version or git commit SHA of kktypr you are using (`kktypr --version`).
      placeholder: v0.1.1 or commit abc1234
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal Emulator & Multiplexer
      description: Your terminal emulator (e.g. Ghostty, Alacritty, Kitty, WezTerm, iTerm2, Windows Terminal) and multiplexer (tmux / zellij) if any.
      placeholder: Ghostty 1.0, Alacritty 0.13, Windows Terminal
    validations:
      required: true
  - type: input
    id: os_info
    attributes:
      label: Operating System & Architecture
      description: Your operating system, kernel, and hardware architecture.
      placeholder: Fedora 41 (x86_64), macOS Sonoma 14.5 (Apple Silicon), Windows 11
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of the bug.
      placeholder: Describe what happened unexpectedly.
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Run `kktypr`
        2. Navigate to 'Course 2: Developer Syntax'
        3. Start lesson 3
        4. See visual glitch or input lag
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What should have happened instead.
    validations:
      required: true
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any terminal screenshot, error log, or environment variables (`TERM`, `COLORTERM`).
    validations:
      required: false
